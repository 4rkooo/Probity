[project]
name = "probity"
version = "0.1.0"
description = "Probity: grounded video-evidence search and provenance-preserving reconstruction (research/demo prototype)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary hackathon prototype" }
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "pyyaml>=6.0,<7",
    "numpy>=2.0,<3",
    "pillow>=10.4",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
# Person 2 (tracking / Probity) and Person 3 (UI / reports) runtimes.
recon = ["opencv-python-headless>=4.10,<5", "scikit-image>=0.24,<0.25"]
ui = ["streamlit>=1.38,<2", "jinja2>=3.1,<4"]

[project.scripts]
probity = "probity.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "hypothesis>=6.100,<7",
    "ruff>=0.6",
    "anyio>=4.4",
]
typecheck = ["mypy>=1.11", "types-pyyaml"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: requires live sponsor credentials; skipped by default",
    "ffmpeg: requires ffmpeg/ffprobe binaries on PATH",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "PT"]
ignore = ["S101", "S603", "S607", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "PT018"]
"scripts/**" = ["S311", "E501"]
"src/probity/domain/prompts.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
mypy_path = "src"
packages = ["probity"]
ignore_missing_imports = true
